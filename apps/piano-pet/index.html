<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffb3c1">
  <title>ピアノペット</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css?v=1">
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- アプリ全体 -->
  <div class="app">

    <!-- ===== ホーム ===== -->
    <section class="view" id="view-home" data-view="home">
      <header class="app-header">
        <h1 class="app-title">ピアノペット</h1>
      </header>
      <div class="view-body view-body--home">
        <p class="placeholder">ここに きーちゃん が あらわれるよ</p>
        <div class="placeholder-card">
          <p>レベル・けいけんち・コイン・れんぞくきろく</p>
          <p class="placeholder-note">（Epic 3・4 でつくります）</p>
        </div>
        <button class="btn-record" id="goRecordBtn" type="button">れんしゅうを きろくする</button>
      </div>
    </section>

    <!-- ===== 練習記録入力 ===== -->
    <section class="view" id="view-record" data-view="record" hidden>
      <header class="app-header app-header--sub">
        <button class="btn-back" id="recordBackBtn" type="button" aria-label="ホームにもどる">‹ もどる</button>
        <h1 class="app-title">れんしゅうを きろく</h1>
      </header>
      <div class="view-body">
        <p class="placeholder">れんしゅうの にゅうりょくフォーム</p>
        <p class="placeholder-note">（Epic 5 でつくります）</p>
      </div>
    </section>

    <!-- ===== 記録履歴 ===== -->
    <section class="view" id="view-history" data-view="history" hidden>
      <header class="app-header">
        <h1 class="app-title">きろく</h1>
      </header>
      <div class="view-body">
        <p class="placeholder">れんしゅうの きろく いちらん</p>
        <p class="placeholder-note">（Epic 6 でつくります）</p>
      </div>
    </section>

    <!-- ===== ショップ ===== -->
    <section class="view" id="view-shop" data-view="shop" hidden>
      <header class="app-header">
        <h1 class="app-title">ショップ</h1>
      </header>
      <div class="view-body">
        <p class="placeholder">アイテムを コインで かおう</p>
        <p class="placeholder-note">（Epic 7 でつくります）</p>
      </div>
    </section>

    <!-- ===== ボトムナビ ===== -->
    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-btn" data-nav="home" type="button">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span class="nav-label">ホーム</span>
      </button>
      <button class="nav-btn" data-nav="history" type="button">
        <span class="nav-icon" aria-hidden="true">📒</span>
        <span class="nav-label">きろく</span>
      </button>
      <button class="nav-btn" data-nav="shop" type="button">
        <span class="nav-icon" aria-hidden="true">🛍️</span>
        <span class="nav-label">ショップ</span>
      </button>
    </nav>

  </div>

  <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
