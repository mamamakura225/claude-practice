<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffb3c1">
  <title>ピアノペット</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css?v=26fcab37">
  <link rel="stylesheet" href="css/cat.css?v=26fcab37">
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- アプリ全体 -->
  <div class="app">

    <!-- ===== ホーム ===== -->
    <section class="view" id="view-home" data-view="home">
      <header class="app-header">
        <h1 class="app-title">ピアノペット</h1>
        <button class="btn-sound" id="soundToggle" type="button" aria-pressed="true" aria-label="サウンドの オン・オフ">🔊</button>
      </header>
      <div class="view-body view-body--home">
        <div id="catStage" class="cat-stage" aria-live="polite"></div>
        <p id="petName" class="pet-name">きーちゃん</p>

        <div class="stats">
          <div class="level-block">
            <div class="level-line">
              <span class="level-badge">レベル <span id="statLevel">1</span></span>
              <span class="level-next" id="statToNext">あと 20 かい で レベルアップ</span>
            </div>
            <div class="xpbar" id="statXpbar" role="progressbar"
                 aria-label="けいけんち" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="xpbar-fill" id="statXpFill"></div>
            </div>
          </div>

          <div class="stat-cards">
            <div class="stat-card stat-card--coin">
              <span class="stat-icon" aria-hidden="true">🪙</span>
              <span class="stat-value" id="statCoins">0</span>
              <span class="stat-label">コイン</span>
            </div>
            <div class="stat-card stat-card--streak">
              <span class="stat-icon" aria-hidden="true">🔥</span>
              <span class="stat-value" id="statStreak">0</span>
              <span class="stat-label">れんぞく日</span>
            </div>
          </div>
        </div>

        <button class="btn-record" id="goRecordBtn" type="button">れんしゅうを きろくする</button>
      </div>
    </section>

    <!-- ===== 練習記録入力 ===== -->
    <section class="view" id="view-record" data-view="record" hidden>
      <header class="app-header app-header--sub">
        <button class="btn-back" id="recordBackBtn" type="button" aria-label="ホームにもどる">‹ もどる</button>
        <h1 class="app-title">れんしゅうを きろく</h1>
      </header>
      <div class="view-body view-body--form">
        <form id="recordForm" class="record-form" novalidate>
          <label class="field">
            <span class="field-label">ひづけ</span>
            <input type="date" id="recordDate" class="field-input" required>
          </label>

          <div class="songs">
            <span class="field-label">れんしゅうした きょく</span>
            <div id="songRows" class="song-rows"></div>
            <button type="button" id="addRowBtn" class="btn-add-row">＋ きょくを ふやす</button>
          </div>

          <div class="record-total" aria-live="polite">
            ごうけい <span id="recordTotal">0</span> かい
          </div>

          <button type="submit" id="recordSubmitBtn" class="btn-record btn-record--submit">きろくする</button>
          <p id="recordError" class="record-error" role="alert" hidden>1かい いじょう にゅうりょくしてね</p>
        </form>
      </div>
    </section>

    <!-- ===== 記録履歴 ===== -->
    <section class="view" id="view-history" data-view="history" hidden>
      <header class="app-header">
        <h1 class="app-title">きろく</h1>
      </header>
      <div class="view-body view-body--history">
        <div class="streak-cards">
          <div class="stat-card stat-card--streak">
            <span class="stat-icon" aria-hidden="true">🔥</span>
            <span class="stat-value" id="historyStreakCurrent">0</span>
            <span class="stat-label">いまの れんぞく</span>
          </div>
          <div class="stat-card stat-card--best">
            <span class="stat-icon" aria-hidden="true">🏆</span>
            <span class="stat-value" id="historyStreakBest">0</span>
            <span class="stat-label">さいこう きろく</span>
          </div>
        </div>

        <section class="history-section">
          <h2 class="history-heading">しゅうごとの れんしゅう</h2>
          <div class="weekly-chart" id="weeklyChart" role="img"
               aria-label="しゅうごとの れんしゅうかいすう ぼうグラフ"></div>
        </section>

        <section class="history-section">
          <h2 class="history-heading">きろく いちらん</h2>
          <div class="history-list" id="historyList"></div>
        </section>
      </div>
    </section>

    <!-- ===== ショップ ===== -->
    <section class="view" id="view-shop" data-view="shop" hidden>
      <header class="app-header">
        <h1 class="app-title">ショップ</h1>
      </header>
      <div class="view-body view-body--shop">
        <div class="shop-coins">
          <span class="stat-icon" aria-hidden="true">🪙</span>
          <span class="shop-coins__value" id="shopCoins">0</span>
          <span class="shop-coins__label">もっている コイン</span>
        </div>
        <div class="shop-list" id="shopList"></div>
      </div>
    </section>

    <!-- ===== バッジ ===== -->
    <section class="view" id="view-badges" data-view="badges" hidden>
      <header class="app-header">
        <h1 class="app-title">バッジ</h1>
      </header>
      <div class="view-body view-body--badges">
        <p class="badges-count" id="badgesCount"></p>
        <div class="badge-grid" id="badgeGrid"></div>
      </div>
    </section>

    <!-- ===== ボトムナビ ===== -->
    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-btn" data-nav="home" type="button">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span class="nav-label">ホーム</span>
      </button>
      <button class="nav-btn" data-nav="history" type="button">
        <span class="nav-icon" aria-hidden="true">📒</span>
        <span class="nav-label">きろく</span>
      </button>
      <button class="nav-btn" data-nav="shop" type="button">
        <span class="nav-icon" aria-hidden="true">🛍️</span>
        <span class="nav-label">ショップ</span>
      </button>
      <button class="nav-btn" data-nav="badges" type="button">
        <span class="nav-icon" aria-hidden="true">🏅</span>
        <span class="nav-label">バッジ</span>
      </button>
    </nav>

    <!-- ===== 獲得コインのポップアップ ===== -->
    <div id="coinPopup" class="coin-popup" role="status" aria-live="polite" hidden>
      <div class="coin-popup__card">
        <span class="coin-popup__icon" aria-hidden="true">🪙</span>
        <span class="coin-popup__amount" id="coinPopupAmount">+0</span>
        <span class="coin-popup__label">コイン ゲット！</span>
        <span class="coin-popup__levelup" id="coinPopupLevelUp" hidden>レベルアップ！🎉</span>
      </div>
    </div>

    <!-- ===== バッジ獲得のポップアップ ===== -->
    <div id="badgePopup" class="coin-popup" role="status" aria-live="polite" hidden>
      <div class="coin-popup__card">
        <span class="coin-popup__icon" id="badgePopupIcon" aria-hidden="true">🏅</span>
        <span class="badge-popup__name" id="badgePopupName"></span>
        <span class="coin-popup__label">バッジ ゲット！</span>
      </div>
    </div>

  </div>

  <script type="module" src="js/app.js?v=26fcab37"></script>
</body>
</html>
