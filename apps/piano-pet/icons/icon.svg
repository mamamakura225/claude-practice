      <path d="M-70 18 l-58 -10 M-70 36 l-56 8"/>
      <path d="M70 18 l58 -10 M70 36 l56 8"/>
    </g>
  </g>
  <!-- 音符 -->
  <g fill="#ff7a93">
    <circle cx="392" cy="150" r="20"/>
