<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ピアノペット">
  <rect width="512" height="512" rx="112" fill="#ffb3c1"/>
  <!-- スコティッシュフォールド（折れ耳・丸顔） -->
  <g transform="translate(256 248)">
    <!-- 折れ耳 -->
    <path d="M-118 -78 q-22 36 8 70 q26 -18 30 -54 z" fill="#f3d9c6"/>
    <path d="M118 -78 q22 36 -8 70 q-26 -18 -30 -54 z" fill="#f3d9c6"/>
    <!-- 顔 -->
    <ellipse cx="0" cy="0" rx="140" ry="128" fill="#fbe9da"/>
    <!-- 目 -->
    <circle cx="-54" cy="-6" r="17" fill="#4a3b3b"/>
    <circle cx="54" cy="-6" r="17" fill="#4a3b3b"/>
    <circle cx="-48" cy="-12" r="5" fill="#fff"/>
    <circle cx="60" cy="-12" r="5" fill="#fff"/>
    <!-- 鼻と口 -->
    <path d="M0 28 l-12 -14 h24 z" fill="#ff7a93"/>
    <path d="M0 28 q-16 22 -34 10 M0 28 q16 22 34 10" fill="none" stroke="#4a3b3b" stroke-width="5" stroke-linecap="round"/>
    <!-- ひげ -->
