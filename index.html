<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アプリ一覧</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #CC0033;
      --primary-dark: #A30029;
      --primary-bg: #fff0f3;
      --bg: #F2F3F5;
      --card-bg: #FFFFFF;
      --text: #1A1A1A;
      --text-sub: #525965;
      --border: #E5E7EB;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.13);
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      gap: 32px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      text-align: center;
    }
    .lead { color: var(--text-sub); font-size: 0.9rem; text-align: center; margin-top: 8px; }
    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 720px;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(204, 0, 51, 0.15);
    }
    .card .emoji { font-size: 3rem; line-height: 1; }
    .card .name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }
    .card:hover .name { color: var(--primary); }
    .card .desc { font-size: 0.85rem; color: var(--text-sub); text-align: center; }
    footer { font-size: 0.75rem; color: var(--text-sub); opacity: 0.7; }
  </style>
</head>
<body>
  <header>
    <h1>アプリ一覧</h1>
    <p class="lead">つくったアプリの入口です</p>
  </header>

  <main class="apps">
    <a class="card" href="/dtask/">
      <span class="emoji" aria-hidden="true">✅</span>
      <span class="name">dタスク</span>
      <span class="desc">リスト / カンバンのタスク管理アプリ</span>
    </a>
    <a class="card" href="/piano-pet/">
      <span class="emoji" aria-hidden="true">🐱</span>
      <span class="name">ピアノペット</span>
      <span class="desc">猫を育てるピアノ練習アプリ</span>
    </a>
  </main>

  <footer>claude-practice</footer>
</body>
</html>
