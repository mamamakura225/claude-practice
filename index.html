<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アプリ一覧</title>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      color: #4a3b3b;
      background: linear-gradient(160deg, #fff6ee 0%, #ffe9f0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      gap: 32px;
    }
    h1 {
      font-family: 'Mochiy Pop One', sans-serif;
      font-size: 1.8rem;
      color: #ff7a93;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .lead { color: #8a7a7a; font-size: 0.95rem; text-align: center; margin-top: 8px; }
    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 720px;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border-radius: 22px;
      padding: 28px 24px;
      box-shadow: 0 8px 22px rgba(255, 122, 147, 0.18);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(255, 122, 147, 0.28); }
    .card .emoji { font-size: 3rem; line-height: 1; }
    .card .name {
      font-family: 'Mochiy Pop One', sans-serif;
      font-size: 1.25rem;
      color: #ff7a93;
    }
    .card .desc { font-size: 0.85rem; color: #8a7a7a; text-align: center; }
    footer { font-size: 0.75rem; color: #b0a3a3; }
  </style>
</head>
<body>
  <header>
    <h1>アプリ一覧</h1>
    <p class="lead">つくったアプリの入口です</p>
  </header>

  <main class="apps">
    <a class="card" href="/dtask/">
      <span class="emoji" aria-hidden="true">✅</span>
      <span class="name">dタスク</span>
      <span class="desc">リスト / カンバンのタスク管理アプリ</span>
    </a>
    <a class="card" href="/piano-pet/">
      <span class="emoji" aria-hidden="true">🐱</span>
      <span class="name">ピアノペット</span>
      <span class="desc">猫を育てるピアノ練習アプリ</span>
    </a>
  </main>

  <footer>claude-practice</footer>
</body>
</html>
